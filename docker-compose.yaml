services:
  signalk-server:
    image: signalk/signalk-server:latest
    container_name: signalk-server
    restart: unless-stopped
    #   ----------------------
    network_mode: host
    #    network_mode: bridge    # (1/3) If bridge-mode is used, then comment line abobe (host) and select/add needed ports settings
    #    ports:    # (2/3)
    #      - "3000:3000"    # (3/3)
    #   ----------------------
    #environment:
    #  - IS_IN_DOCKER=True
    #    environment:    # (1/5) SK ENV parameters
    #      - PORT=3000    # (2/5)
    #      - SSLPORT=3443    # (3/5)
    #      - NMEA0183PORT=10110    # (4/5)
    #      - TCPSTREAMPORT=8375    # (5/5)
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0:ro
    #   ----------------------
    volumes:
    #  - ./dev:/dev
      - ./signalk_conf:/home/node/.signalk    # uncomment and make signalk_conf -folder where .signalk is bind mounted
    #   ----------------------
    #      - type: bind    # (1/3) uncomment these 3 lines to control startup.sh outside container
    #        source: $PWD/startup.sh    # (2/3)
    #        target: /home/node/signalk/startup.sh    # (3/3)
    #   ----------------------
    # entrypoint: sh /home/node/signalk/startup.sh
    privileged: true
    logging:
      options:
        max-size: 10m


  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    volumes:
      - ./cloudflared:/etc/cloudflared
    network_mode: host


  influxdb2:
    image: influxdb:2
    ports:
      - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB2_ADMIN_USERNAME:-influxdb2-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB2_ADMIN_PASSWORD:-influxdb2-admin-password}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB2_ADMIN_TOKEN:-influxdb2-admin-token}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB2_INIT_ORG:-boats}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB2_INIT_BUCKET:-boatname}
    volumes:
      - ./influxdb2-data:/var/lib/influxdb2
      - ./influxdb2-config:/etc/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    # if you are running as root then set it to 0
    # else find the right id with the id -u command
    user: '0'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_SERVER_ROOT_URL: ${GRAFANA_SERVER_ROOT_URL:-http://localhost:3001}
    ports:
      - '3001:3000'
    # adding the mount volume point which we create earlier
    volumes:
      - ./grafana_data:/var/lib/grafana
